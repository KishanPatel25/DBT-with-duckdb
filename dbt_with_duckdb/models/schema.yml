version: 2

models:
  - name: fct_orders
    description: Fact table with orders and customer details
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customer
        tests:
          - not_null
      - name: customer_name
        description: Customer name from join
      - name: order_date
        description: Date order was placed
      - name: amount
        description: Order amount in USD
      - name: status
        description: Order status
